name: Multi-account browser verification

on:
  push:
    branches:
      - feature/multi-account-browser-profiles
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Test account migration and identity isolation
        run: bun test apps/electron/src/main/lib/social-account-registry.test.ts
      - name: Typecheck workspace
        run: bun run typecheck

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Build Windows distribution
        run: bun run dist:win
      - name: Upload Windows installer for testing
        uses: actions/upload-artifact@v4
        with:
          name: proma-social-profiles-windows
          path: |
            apps/electron/release/**/*.exe
            apps/electron/dist/**/*.exe
            dist/**/*.exe
          if-no-files-found: error
