name: Build Windows EXE

on:
  push:
    branches:
      - build-windows-20004-latest

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare OfficeCLI
        run: bun run --filter='@proma/electron' prepare:officecli

      - name: Build Electron app
        run: bun run electron:build

      - name: Prepare runtime dependencies
        shell: bash
        run: |
          bun run --filter='@proma/electron' sync:runtime-deps
          bun run --filter='@proma/electron' rebuild:node-pty

      - name: Package Windows EXE
        run: npx electron-builder --win --x64 --publish never
        working-directory: apps/electron

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Proma-20004-v0.19.58-Windows-x64
          path: apps/electron/out/*.exe
          if-no-files-found: error
          retention-days: 30
