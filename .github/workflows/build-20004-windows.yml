name: 20004 Edition Windows Build

on:
  push:
    branches:
      - costguard-v1
      - 20004-edition
      - 20004-edition-v0.19.53
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 20004-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Proma 20004 Edition (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test update publication
        run: bun test apps/electron/scripts/verify-windows-release.test.ts apps/electron/scripts/github-update-channel.test.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Build Electron
        run: bun run electron:build

      - name: Sync runtime dependencies
        run: bun run --filter='@proma/electron' sync:runtime-deps

      - name: Package Windows x64
        working-directory: apps/electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Path apps/electron/out -File |
            Where-Object {
              $_.Name -like 'Proma-20004-Setup-*.exe' -or
              $_.Name -like 'Proma-20004-Setup-*.exe.blockmap' -or
              $_.Name -eq 'latest.yml'
            } |
            ForEach-Object { Copy-Item $_.FullName -Destination artifacts -Force }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Proma-20004-Edition-Windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      # electron-builder 默认创建草稿；只有工件全部通过校验后才正式发布。
      - name: Publish verified Windows update
        if: github.ref == 'refs/heads/20004-edition'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const root = process.env.GITHUB_WORKSPACE;
            const version = JSON.parse(fs.readFileSync(path.join(root, 'apps/electron/package.json'), 'utf8')).version;
            const tag = `v${version}`;
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const release = releases.find(item => item.tag_name === tag);
            if (!release) throw new Error(`找不到待发布版本：${tag}`);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...context.repo, release_id: release.id, per_page: 100 });
            const { verifyWindowsRelease } = require(path.join(root, 'apps/electron/scripts/verify-windows-release.cjs'));
            const installer = verifyWindowsRelease(version, path.join(root, 'apps/electron/out'), assets);
            const published = await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: release.id,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Proma 20004 Edition ${version}`,
              body: '支持从 cn20004/Proma 在线检查、下载和安装更新；保留 OpenCode Go 与所有复古主题。',
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });
            if (published.data.draft) throw new Error('发布后仍处于草稿状态');
            core.notice(`已正式发布 ${tag}，在线更新工件：${installer}`);
            await core.summary.addHeading('Windows 在线更新已发布').addLink(tag, published.data.html_url).write();
