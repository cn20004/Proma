name: Publish Proma 20004 In-App Auto Update

on:
  push:
    branches:
      - main
    paths:
      - 'apps/electron/**'
      - '.github/workflows/publish-20004-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proma-20004-release
  cancel-in-progress: false

jobs:
  build-and-release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run updater and 20004 permission tests
        run: bun test apps/electron/src/main/lib/updater apps/electron/src/main/lib/agent-permission-service.test.ts
      - name: Prepare OfficeCLI
        run: bun run --filter='@proma/electron' prepare:officecli
      - name: Build Electron app
        run: bun run electron:build
      - name: Prepare runtime dependencies
        shell: bash
        run: |
          bun run --filter='@proma/electron' sync:runtime-deps
          bun run --filter='@proma/electron' rebuild:node-pty
      - name: Package Windows updater assets
        run: npx electron-builder --win --x64 --publish never
        working-directory: apps/electron
      - name: Verify update manifest and package
        shell: pwsh
        run: |
          $manifest = 'apps/electron/out/latest.yml'
          if (!(Test-Path $manifest)) { throw 'Missing latest.yml, in-app auto update cannot work' }
          $exe = Get-ChildItem 'apps/electron/out/*.exe' | Select-Object -First 1
          if (!$exe) { throw 'Missing NSIS installer' }
          $body = Get-Content $manifest -Raw
          if (!$body.Contains($exe.Name)) { throw 'Update manifest does not refer to generated EXE' }
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $p = Get-Content 'apps/electron/package.json' -Raw | ConvertFrom-Json
          "version=$($p.version)" >> $env:GITHUB_OUTPUT
      - name: Publish GitHub release with updater metadata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Proma 20004 Edition v${{ steps.version.outputs.version }}
          make_latest: true
          prerelease: false
          generate_release_notes: true
          files: |
            apps/electron/out/*.exe
            apps/electron/out/*.blockmap
            apps/electron/out/latest.yml
          fail_on_unmatched_files: true
