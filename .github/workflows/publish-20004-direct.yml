name: Publish Proma 20004 Direct Release

on:
  push:
    branches:
      - release-20004-direct

permissions:
  contents: write

jobs:
  build-and-release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run 20004 permission tests
        run: bun test apps/electron/src/main/lib/agent-permission-service.test.ts

      - name: Prepare OfficeCLI
        run: bun run --filter='@proma/electron' prepare:officecli

      - name: Build Electron app
        run: bun run electron:build

      - name: Prepare runtime dependencies
        shell: bash
        run: |
          bun run --filter='@proma/electron' sync:runtime-deps
          bun run --filter='@proma/electron' rebuild:node-pty

      - name: Package Windows EXE
        run: npx electron-builder --win --x64 --publish never
        working-directory: apps/electron

      - name: Rename installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem "apps/electron/out/*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "apps/electron/out/Proma-20004-Setup-0.19.58-20004.3.exe"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.19.58-20004.3
          name: Proma 20004 Edition v0.19.58-20004.3
          body: |
            Proma 20004 Edition Full Auto
            - Upstream base: Proma v0.19.58
            - Full Auto permission mode
            - BrowserUpload auto-approved outside Plan mode
            - Official auto-update disabled to prevent overwriting custom build
          files: |
            apps/electron/out/Proma-20004-Setup-0.19.58-20004.3.exe
          draft: false
          prerelease: false
