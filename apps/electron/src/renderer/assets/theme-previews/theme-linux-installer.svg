<svg xmlns="http://www.w3.org/2000/svg" width="198" height="366" viewBox="0 0 198 366">
<rect width="198" height="366" fill="#0000aa"/>
<text x="14" y="30" fill="#fff" font-family="monospace" font-size="11" font-weight="700">[ Proma Linux Setup ]</text>
<text x="14" y="58" fill="#fff" font-family="monospace" font-size="9">Welcome to Proma Setup</text>
<text x="14" y="78" fill="#fff" font-family="monospace" font-size="9">Choose an action:</text>
<rect x="12" y="96" width="174" height="28" fill="#00aaaa"/>
