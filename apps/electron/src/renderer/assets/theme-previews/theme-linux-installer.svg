<text x="20" y="143" fill="#fff" font-family="monospace" font-size="9">  Open workspace</text>
<text x="20" y="164" fill="#fff" font-family="monospace" font-size="9">  Configure models</text>
<text x="20" y="185" fill="#fff" font-family="monospace" font-size="9">  Exit</text>
